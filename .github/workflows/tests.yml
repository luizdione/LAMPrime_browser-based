name: reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r tools/tests/requirements.txt

      - name: Syntax check the engine
        run: node --check app.js

      - name: Engine self-test (Mg2+ / specificity math)
        run: node tools/mgspec.mjs

      - name: Reproducibility suite (constants vs literature + BioPython)
        run: python tools/tests/run_tests.py
